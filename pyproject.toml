[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "moesoc-endpoint"
version = "1.1.0"
description = "Local-first Windows host-based detection and investigation tool."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7",
    "PyYAML>=6.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
moesoc-cli = "moesoc.cli:main"

[tool.setuptools.packages.find]
include = ["moesoc*"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py312"
# Scratch data from verification runs (git-ignored) is not project code.
extend-exclude = [".verify-data", "audit", "live-validation-data", ".pytest-tmp"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # modern syntax
    "B",        # bugbear
    "SIM",      # simplifications
    "S",        # bandit security checks
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # allow typographic characters (—, …) in UI text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of tests

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "windows: requires a real Windows host with Event Log access (skipped elsewhere)",
]
