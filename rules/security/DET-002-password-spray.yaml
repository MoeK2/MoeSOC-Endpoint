# Password spraying: a few guesses against MANY accounts from one source, which
# stays below per-account lockout limits and so evades DET-001.
rule_id: DET-002
version: "1.1"   # 1.1: proven domain aliases (CORP = corp.local)
title: Password Spray Behavior
kind: detection
severity: MEDIUM
confidence: MEDIUM
description: >-
  One source failed to log on as several different accounts within a short
  window. This pattern is typical of password spraying or account enumeration,
  but shared machines, misconfigured services and scanners can produce it too.
mitre:
  - id: T1110.003
    name: "Brute Force: Password Spraying"
    tactic: Credential Access
parameters:
  event_id: 4625
  min_distinct_accounts: 5   # distinct account identities from one source...
  window_minutes: 30         # ...within this rolling window
false_positives:
  - Shared or kiosk computer where several users mistype passwords
  - Service or scheduled tasks running as several accounts with expired passwords
  - Vulnerability scanner or authorized penetration test
  - Jump host or proxy that forwards many users' logons from one address
recommended_investigation:
  - Check which accounts were tried; "account does not exist" failures suggest enumeration
  - Identify the source host; is it expected to authenticate as these accounts?
  - Look for a later successful logon from the same source (any account)
  - Review lockout events and the logon types used
